server {
    listen 8081;
    server_name _;

    # Maven 静态仓库：目录结构即 Maven 仓库布局，Mirror 指向 /maven
    location /maven/ {
        alias /data/maven/;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Go module proxy：GOMODCACHE 的 cache/download 布局，GOPROXY 指向 /go
    location /go/ {
        alias /data/go/;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Node.js 发行包：对齐 nodejs.org/dist 布局，供 frontend-maven-plugin 使用
    location /node-dist/ {
        alias /data/node-dist/;
        autoindex on;
        try_files $uri =404;
    }

    # Cargo 离线源（vendor 产物 + 配置模板）
    location /cargo/ {
        alias /data/cargo/;
        autoindex on;
        try_files $uri =404;
    }

    # pip wheelhouse：pip install --find-links http://<ip>:8081/pip/wheels
    location /pip/ {
        alias /data/pip/;
        autoindex on;
        try_files $uri =404;
    }

    client_max_body_size 0;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
}
